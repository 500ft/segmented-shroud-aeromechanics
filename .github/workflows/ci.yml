name: repository-contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Check research repository contract
        run: python scripts/check_repo_contract.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check README links, identity and negative controls
        run: |
          python tools/check_presentation.py . "Segmented Shroud Aeromechanics" segmented-shroud-aeromechanics
          python tools/test_presentation.py
