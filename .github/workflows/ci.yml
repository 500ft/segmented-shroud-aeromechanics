name: repository-contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Check research repository contract
        run: python scripts/check_repo_contract.py
      - name: Check the canonical quantity register against the code
        run: python scripts/check_quantities.py
      - name: Check the Study A candidate design document is current
        run: python scripts/study_a_design.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check README links, identity and negative controls
        run: |
          python tools/check_presentation.py . "Segmented Shroud Aeromechanics" segmented-shroud-aeromechanics
          python tools/test_presentation.py
